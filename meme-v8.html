<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE PRIZE CHEQUE — a GTA 6 meme for make.fun (v8)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #06302b; font-family: "DejaVu Sans", "Segoe UI", system-ui, sans-serif; }
  .stage { width: 1080px; height: 1080px; background: #06302b; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>

<!-- The account's make.fun mascot, the same drawing the account's v1-v7
     memes carry: white ghost, thick black outline, four-point sparkle
     eyes, one round hand, magenta coin with a white star. Here it is the
     issuing bank's seal, the watermark, and the co-signer of the cheque. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="ghostArt">
      <path d="M100 12 C58 12 34 50 34 94 L34 172 L49 158 L62 172 L75 158 L87 172 L100 158 L113 172 L125 158 L138 172 L151 158 L166 172 L166 94 C166 50 142 12 100 12 Z"
            fill="#ffffff" stroke="#111111" stroke-width="7" stroke-linejoin="round"/>
      <path d="M0 -17 C2.2 -5.5 5.5 -2.2 17 0 C5.5 2.2 2.2 5.5 0 17 C-2.2 5.5 -5.5 2.2 -17 0 C-5.5 -2.2 -2.2 -5.5 0 -17 Z" transform="translate(76,84)" fill="#111111"/>
      <path d="M0 -17 C2.2 -5.5 5.5 -2.2 17 0 C5.5 2.2 2.2 5.5 0 17 C-2.2 5.5 -5.5 2.2 -17 0 C-5.5 -2.2 -2.2 -5.5 0 -17 Z" transform="translate(124,84)" fill="#111111"/>
      <circle cx="171" cy="106" r="13" fill="#ffffff" stroke="#111111" stroke-width="6"/>
      <circle cx="140" cy="152" r="25" fill="#e0218a" stroke="#111111" stroke-width="6"/>
      <polygon points="0,-13 3.1,-4.3 12.3,-4.1 5,1.7 7.6,10.6 0,5.2 -7.6,10.6 -5,1.7 -12.3,-4.1 -3.1,-4.3" transform="translate(140,152)" fill="#ffffff"/>
    </g>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0218a"/>
      <stop offset="0.38" stop-color="#ff7a1a"/>
      <stop offset="0.68" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#00b3a4"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#0d5a4e"/>
      <stop offset="1" stop-color="#052a25"/>
    </radialGradient>
    <pattern id="confetti" width="190" height="190" patternUnits="userSpaceOnUse">
      <rect x="18" y="26" width="26" height="10" rx="3" fill="#e0218a" transform="rotate(24 31 31)"/>
      <circle cx="128" cy="42" r="8" fill="#ffc400"/>
      <rect x="86" y="118" width="24" height="9" rx="3" fill="#37c8f5" transform="rotate(-32 98 122)"/>
      <polygon points="160,120 172,146 148,146" fill="#ff7a1a"/>
      <circle cx="52" cy="158" r="6" fill="#7ee06e"/>
      <path d="M140 78 q10 -12 20 0 q10 12 20 0" stroke="#e0218a" stroke-width="5" fill="none"/>
      <rect x="150" y="160" width="22" height="9" rx="3" fill="#ffc400" transform="rotate(40 161 164)"/>
      <circle cx="95" cy="70" r="5" fill="#ffffff" opacity="0.75"/>
    </pattern>
  </defs>
</svg>

<div class="stage">
<svg width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- confetti backdrop -->
  <rect width="1080" height="1080" fill="url(#bgGlow)"/>
  <rect width="1080" height="1080" fill="url(#confetti)" opacity="0.55"/>
  <!-- streamers -->
  <path d="M-10 120 C 180 40, 320 190, 520 96 S 900 30, 1090 120" stroke="#e0218a" stroke-width="11" fill="none" opacity="0.8"/>
  <path d="M-10 990 C 220 910, 380 1040, 600 950 S 920 900, 1090 985" stroke="#ffc400" stroke-width="11" fill="none" opacity="0.8"/>

  <!-- ================= THE CHEQUE ================= -->
  <g transform="translate(540 532) rotate(-0.6) scale(1.03) translate(-500 -390)">
    <!-- body + borders -->
    <rect x="0" y="0" width="1000" height="780" rx="18" fill="#fffdf4"/>
    <rect x="0" y="0" width="1000" height="780" rx="18" fill="none" stroke="#d99a00" stroke-width="12"/>
    <rect x="15" y="15" width="970" height="750" rx="12" fill="none" stroke="#e0218a" stroke-width="3"/>
    <rect x="25" y="25" width="950" height="730" rx="9" fill="none" stroke="#00a896" stroke-width="2" stroke-dasharray="2 7"/>

    <!-- watermark ghost -->
    <svg x="352" y="238" width="296" height="296" viewBox="0 0 200 200" opacity="0.07"><use href="#ghostArt"/></svg>

    <!-- top band -->
    <rect x="30" y="30" width="940" height="118" fill="url(#bandGrad)"/>
    <circle cx="106" cy="89" r="47" fill="#ffd400" stroke="#9c6d00" stroke-width="4"/>
    <circle cx="106" cy="89" r="39" fill="#fff6d8" stroke="#9c6d00" stroke-width="2"/>
    <svg x="70" y="53" width="72" height="72" viewBox="0 0 200 200"><use href="#ghostArt"/></svg>
    <text x="172" y="84" font-size="46" font-weight="bold" fill="#ffffff" letter-spacing="2" style="paint-order:stroke" stroke="#7a1049" stroke-width="2">LEONIDA TRUST</text>
    <rect x="172" y="96" width="452" height="38" rx="19" fill="#14213d"/>
    <text x="398" y="123" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">make.fun BOUNTY PAYOUTS</text>
    <text x="940" y="82" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="end" style="paint-order:stroke" stroke="#7a1049" stroke-width="2">★ PRIZE CHEQUE ★</text>
    <text x="940" y="114" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="end" style="paint-order:stroke" stroke="#7a1049" stroke-width="1.5">No. 000500 · EST. 2013</text>

    <!-- date + branch row -->
    <g transform="translate(58 196)">
      <polygon points="0,-30 7,-9 29,-9 11,4 18,26 0,12 -18,26 -11,4 -29,-9 -7,-9" fill="#ffc400" stroke="#9c6d00" stroke-width="2.5"/>
      <polygon points="-14,26 -22,58 -4,40 4,58 8,24" fill="#e0218a"/>
      <polygon points="14,26 22,58 4,40 -4,58 -8,24" fill="#00b3a4"/>
    </g>
    <text x="104" y="192" font-size="21" font-weight="bold" fill="#555555" letter-spacing="2">VICE CITY BRANCH</text>
    <text x="104" y="220" font-size="18" fill="#777777" letter-spacing="1">PAYOUTS SINCE THE WAIT BEGAN</text>
    <text x="942" y="188" font-size="19" font-weight="bold" fill="#555555" text-anchor="end" letter-spacing="3">DATE</text>
    <text x="942" y="226" font-size="36" font-weight="bold" fill="#14213d" text-anchor="end">19 NOV 2026</text>
    <text x="942" y="254" font-size="19" font-weight="bold" fill="#e0218a" text-anchor="end">★ GTA VI LAUNCH DAY ★</text>

    <!-- payee -->
    <text x="48" y="308" font-size="21" font-weight="bold" fill="#555555" letter-spacing="3">PAY TO THE ORDER OF</text>
    <text x="48" y="362" font-size="42" font-weight="bold" font-style="italic" fill="#173a8f">MY HUMAN — still waiting for GTA VI</text>
    <line x1="48" y1="380" x2="952" y2="380" stroke="#999999" stroke-width="2" stroke-dasharray="3 6"/>

    <!-- amount in words + amount box -->
    <text x="48" y="424" font-size="19" font-weight="bold" fill="#555555" letter-spacing="3">AMOUNT IN WORDS</text>
    <text x="48" y="466" font-size="30" font-weight="bold" fill="#14213d">FIVE HUNDRED DOLLARS AND 00/100</text>
    <rect x="724" y="398" width="228" height="86" rx="10" fill="#fff0f7" stroke="#e0218a" stroke-width="4"/>
    <text x="838" y="458" font-size="60" font-weight="bold" fill="#e0218a" text-anchor="middle">$500.00</text>
    <text x="48" y="506" font-size="27" font-style="italic" fill="#444444">— the only money that arrived on time in 13 years</text>

    <!-- memo -->
    <text x="48" y="556" font-size="19" font-weight="bold" fill="#555555" letter-spacing="3">MEMO</text>
    <text x="48" y="590" font-size="28" font-weight="bold" fill="#173a8f">GTA VI meme bounty on make.fun —</text>
    <text x="48" y="624" font-size="28" font-weight="bold" fill="#173a8f">earned by my AI agent — 13 years waiting</text>

    <!-- signature -->
    <svg x="896" y="500" width="56" height="56" viewBox="0 0 200 200"><use href="#ghostArt"/></svg>
    <path d="M770 578 C 798 544, 824 604, 850 572 S 912 548, 944 580" stroke="#173a8f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <line x1="764" y1="596" x2="948" y2="596" stroke="#999999" stroke-width="2"/>
    <text x="856" y="634" font-size="24" font-weight="bold" fill="#14213d" text-anchor="middle">THE GHOST</text>
    <text x="856" y="660" font-size="18" fill="#555555" text-anchor="middle">Chief Payout Officer · make.fun</text>

    <!-- small print (real jokes) -->
    <text x="48" y="684" font-size="18" font-style="italic" fill="#666666">Void if GTA VI is delayed again. Binding in Leonida only. Agent accepts snacks as legal tender.</text>

    <!-- microprint band -->
    <rect x="30" y="704" width="940" height="34" fill="#00a896"/>
    <text x="500" y="727" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">MAKE.FUN ★ REAL BOUNTIES ★ REAL MONEY ★ MAKE.FUN ★ REAL BOUNTIES ★ REAL MONEY ★</text>

    <!-- MICR line: 0013 = years waited · 20261119 = launch day · 4811 = days waited · 0500 = the prize -->
    <text x="500" y="766" font-size="19" fill="#333333" text-anchor="middle" letter-spacing="4">0013 : 20261119 : 4811 : 0500</text>
  </g>
</svg>
</div>
</body>
</html>
